name: Deploy to HyperCloudHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to HyperCloudHost
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Validate Secrets
        id: check-secrets
        run: |
          echo "=== VALIDASI GITHUB SECRETS UNTUK HYPERCLOUDHOST ==="
          MISSING_SECRETS=()
          [ -z "${{ secrets.HYPERCLOUD_SSH_HOST }}" ] && MISSING_SECRETS+=("HYPERCLOUD_SSH_HOST")
          [ -z "${{ secrets.HYPERCLOUD_SSH_USER }}" ] && MISSING_SECRETS+=("HYPERCLOUD_SSH_USER")
          [ -z "${{ secrets.HYPERCLOUD_SSH_PRIVATE_KEY }}" ] && MISSING_SECRETS+=("HYPERCLOUD_SSH_PRIVATE_KEY")
          [ -z "${{ secrets.HYPERCLOUD_SSH_KEY_PASSPHRASE }}" ] && MISSING_SECRETS+=("HYPERCLOUD_SSH_KEY_PASSPHRASE")

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "=========================================================================="
            echo "❌ AUTO DEPLOY BLOCKED!"
            echo "GitHub Secret berikut belum dikonfigurasi di GitHub Repository:"
            for s in "${MISSING_SECRETS[@]}"; do
              echo "  - $s"
            done
            echo ""
            echo "Silakan tambahkan di Settings > Secrets and variables > Actions:"
            echo "  - HYPERCLOUD_SSH_HOST           : IP / Hostname HyperCloudHost"
            echo "  - HYPERCLOUD_SSH_PORT           : Port SSH (default: 22 atau port cPanel)"
            echo "  - HYPERCLOUD_SSH_USER           : Username SSH / cPanel"
            echo "  - HYPERCLOUD_SSH_PRIVATE_KEY    : Encrypted Private Key SSH (OpenSSH format)"
            echo "  - HYPERCLOUD_SSH_KEY_PASSPHRASE : Passphrase untuk decrypt SSH Private Key"
            echo "  - HYPERCLOUD_APP_PATH           : Path aplikasi (default: ~/seraphigame)"
            echo "=========================================================================="
            exit 1
          fi
          echo "✅ Semua secrets SSH wajib tersedia (termasuk SSH key passphrase)."

      - name: 3. Setup Node.js (18.20.8)
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
          cache: 'npm'

      - name: 4. Install Dependencies
        run: |
          echo "=== INSTALL DEPENDENCIES DI GITHUB RUNNER ==="
          npm ci

      - name: 5. Build Next.js Production Bundle
        id: build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_PROVIDER: ${{ secrets.DATABASE_PROVIDER || 'postgres' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
        run: |
          echo "=== PRODUCTION BUILD NEXT.JS DI GITHUB RUNNER ==="
          echo "Target Node.js: 18.20.8"
          echo "Commit SHA: ${{ github.sha }}"
          npm run build
          if [ ! -d ".next" ] || [ ! -f ".next/BUILD_ID" ]; then
            echo "❌ BUILD GAGAL: Direktori .next tidak terbentuk atau tidak valid."
            exit 1
          fi
          echo "✅ BUILD BERHASIL: Production bundle .next siap dideploy."

      - name: 6. Prepare Production Artifact Archive
        run: |
          echo "=== PACKAGING PRODUCTION ARTIFACT ==="
          mkdir -p dist_package
          
          # Salin file runtime produksi wajib
          cp -r .next dist_package/
          cp -r public dist_package/
          cp server.js dist_package/
          cp package.json dist_package/
          cp package-lock.json dist_package/
          cp next.config.mjs dist_package/
          [ -d "src" ] && cp -r src dist_package/

          # Verifikasi tidak ada file terlarang yang masuk ke archive
          rm -f dist_package/.env* dist_package/*.db dist_package/*.sqlite* dist_package/*.zip
          
          # Kompresi tar.gz untuk transfer ultra-cepat dan aman
          tar -czf artifact.tar.gz -C dist_package .
          ARTIFACT_SIZE=$(du -h artifact.tar.gz | cut -f1)
          echo "✅ Production artifact berhasil dikompresi: $ARTIFACT_SIZE"

      - name: 7. Setup SSH & Unlock Key via ssh-agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HYPERCLOUD_SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.HYPERCLOUD_SSH_KEY_PASSPHRASE }}
          SSH_HOST: ${{ secrets.HYPERCLOUD_SSH_HOST }}
          SSH_PORT: ${{ secrets.HYPERCLOUD_SSH_PORT || '22' }}
        run: |
          echo "=== KONFIGURASI SSH & UNLOCK KEY DENGAN SSH-AGENT ==="
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 1. Tulis private key secara aman tanpa mencetak ke log
          printf "%s\n" "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 2. Inisialisasi ssh-agent di runner
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

          # 3. Unlock encrypted private key menggunakan HYPERCLOUD_SSH_KEY_PASSPHRASE
          if [ -n "$SSH_PASSPHRASE" ]; then
            echo "Memproses private key terenkripsi dengan passphrase..."
            
            # Buat helper script sementara untuk SSH_ASKPASS (mencegah prompt interaktif)
            ASKPASS_SCRIPT=$(mktemp)
            echo '#!/bin/sh' > "$ASKPASS_SCRIPT"
            echo 'exec printf "%s\n" "$SSH_PASSPHRASE"' >> "$ASKPASS_SCRIPT"
            chmod 700 "$ASKPASS_SCRIPT"

            # Muat key ke dalam ssh-agent menggunakan SSH_ASKPASS
            export DISPLAY=":0"
            export SSH_ASKPASS="$ASKPASS_SCRIPT"
            export SSH_ASKPASS_REQUIRE="force"
            ssh-add ~/.ssh/id_rsa < /dev/null

            # Hapus helper script askpass segera
            rm -f "$ASKPASS_SCRIPT"

            # Simpan versi tanpa passphrase di runner sementara untuk kompatibilitas direct command (-i ~/.ssh/id_rsa)
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/id_rsa 2>/dev/null || true
            echo "✅ Private key berhasil di-unlock dan dimuat ke ssh-agent."
          else
            echo "Memuat unencrypted private key ke ssh-agent..."
            ssh-add ~/.ssh/id_rsa < /dev/null
            echo "✅ Private key dimuat ke ssh-agent."
          fi

          # 4. Known hosts & resilient SSH client config
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo -e "Host *\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 60\n  ServerAliveCountMax 5\n" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: 8. Transfer & Deploy Artifact to HyperCloudHost
        id: deploy
        env:
          SSH_HOST: ${{ secrets.HYPERCLOUD_SSH_HOST }}
          SSH_PORT: ${{ secrets.HYPERCLOUD_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.HYPERCLOUD_SSH_USER }}
          APP_PATH: ${{ secrets.HYPERCLOUD_APP_PATH || '~/seraphigame' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "=== DEPLOY ARTIFACT KE HYPERCLOUDHOST ==="
          echo "Target Host : $SSH_HOST:$SSH_PORT"
          echo "Target User : $SSH_USER"
          echo "Target Path : $APP_PATH"
          echo "Commit SHA  : $COMMIT_SHA"

          # 1. Pastikan direktori tujuan & staging tersedia di remote
          ssh -p $SSH_PORT -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST "
            mkdir -p $APP_PATH/.deploy/$COMMIT_SHA
            mkdir -p $APP_PATH/tmp
          "

          # 2. Transfer artifact tar.gz ke staging directory
          scp -P $SSH_PORT -i ~/.ssh/id_rsa artifact.tar.gz $SSH_USER@$SSH_HOST:$APP_PATH/.deploy/$COMMIT_SHA/artifact.tar.gz

          # 3. Ekstrak & backup atomic di remote
          ssh -p $SSH_PORT -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST "
            set -e
            cd $APP_PATH/.deploy/$COMMIT_SHA
            tar -xzf artifact.tar.gz
            rm -f artifact.tar.gz

            # Backup state saat ini untuk auto-rollback bila gagal
            if [ -d \"$APP_PATH/.next\" ]; then
              rm -rf $APP_PATH/.backup_next
              cp -r $APP_PATH/.next $APP_PATH/.backup_next
            fi
            if [ -f \"$APP_PATH/server.js\" ]; then
              cp $APP_PATH/server.js $APP_PATH/.backup_server.js
            fi

            # Install dependencies produksi jika node_modules belum ada atau package-lock berubah (TANPA BUILD)
            cd $APP_PATH
            if [ ! -d \"node_modules\" ] || [ ! -f \"node_modules/.package-lock.json\" ] || ! cmp -s $APP_PATH/.deploy/$COMMIT_SHA/package-lock.json node_modules/.package-lock.json; then
              echo '[REMOTE] Mengupdate production dependencies (npm ci --omit=dev)...'
              npm ci --omit=dev --no-audit || npm install --omit=dev --no-audit
              cp $APP_PATH/.deploy/$COMMIT_SHA/package-lock.json node_modules/.package-lock.json 2>/dev/null || true
            else
              echo '[REMOTE] node_modules sudah up-to-date, melewati npm ci.'
            fi

            # Update file produksi secara aman (JANGAN menyentuh .env, data/, uploads/, database)
            echo '[REMOTE] Mengupdate file aplikasi ke versi baru ($COMMIT_SHA)...'
            rm -rf $APP_PATH/.next
            cp -r $APP_PATH/.deploy/$COMMIT_SHA/.next $APP_PATH/.next
            
            rm -rf $APP_PATH/public
            cp -r $APP_PATH/.deploy/$COMMIT_SHA/public $APP_PATH/public

            cp $APP_PATH/.deploy/$COMMIT_SHA/server.js $APP_PATH/server.js
            cp $APP_PATH/.deploy/$COMMIT_SHA/package.json $APP_PATH/package.json
            cp $APP_PATH/.deploy/$COMMIT_SHA/package-lock.json $APP_PATH/package-lock.json
            cp $APP_PATH/.deploy/$COMMIT_SHA/next.config.mjs $APP_PATH/next.config.mjs
            if [ -d \"$APP_PATH/.deploy/$COMMIT_SHA/src\" ]; then
              rm -rf $APP_PATH/src
              cp -r $APP_PATH/.deploy/$COMMIT_SHA/src $APP_PATH/src
            fi

            # Catat deployed commit
            echo \"$COMMIT_SHA\" > $APP_PATH/.deployed_commit
            echo \"\$(date -u +'%Y-%m-%dT%H:%M:%SZ')\" > $APP_PATH/.deployed_at

            # Bersihkan temporary deploy folder
            rm -rf $APP_PATH/.deploy/$COMMIT_SHA
          "

      - name: 9. Restart Passenger
        id: restart
        env:
          SSH_HOST: ${{ secrets.HYPERCLOUD_SSH_HOST }}
          SSH_PORT: ${{ secrets.HYPERCLOUD_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.HYPERCLOUD_SSH_USER }}
          APP_PATH: ${{ secrets.HYPERCLOUD_APP_PATH || '~/seraphigame' }}
        run: |
          echo "=== RESTART PHUSION PASSENGER ==="
          ssh -p $SSH_PORT -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST "
            mkdir -p $APP_PATH/tmp
            touch $APP_PATH/tmp/restart.txt
            echo '[REMOTE] restart.txt touched at: \$(date)'
          "
          echo "✅ Passenger restart triggered."

      - name: 10. Health Check & Validation (Direct to HyperCloudHost)
        id: health-check
        env:
          SSH_HOST: ${{ secrets.HYPERCLOUD_SSH_HOST }}
          BASE_URL: "https://seraphigame.my.id"
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "=== RUNNING DIRECT HYPERCLOUDHOST HEALTH CHECK ==="
          echo "Target Server IP/Host : $SSH_HOST"
          echo "Target Hostname/SNI   : seraphigame.my.id"
          echo "Commit Verified       : $COMMIT_SHA"
          echo "Catatan: Memaksa koneksi langsung ke HyperCloudHost via curl --resolve (bypass public DNS/Netlify)."
          
          # Tunggu Passenger memuat worker baru
          echo "Menunggu Passenger memuat worker baru (10 detik)..."
          sleep 10

          HEALTH_SUCCESS=false
          for i in {1..6}; do
            echo "Percobaan Health Check #$i..."
            HTTP_STATUS=$(curl -k -s -S \
              --resolve "seraphigame.my.id:443:${SSH_HOST}" \
              --resolve "seraphigame.my.id:80:${SSH_HOST}" \
              -o /tmp/health_res.txt -w "%{http_code}" "$BASE_URL/api/health" || echo "000")
            BODY=$(cat /tmp/health_res.txt 2>/dev/null || echo "")
            echo "HTTP Status /api/health: $HTTP_STATUS"
            echo "Response: $BODY"

            if [ "$HTTP_STATUS" -eq 200 ] && echo "$BODY" | grep -q '"database":"connected"'; then
              HEALTH_SUCCESS=true
              echo "✅ /api/health PASS langsung di HyperCloudHost (database: connected)"
              break
            fi
            echo "Worker masih reload atau database connecting, menunggu 5 detik..."
            sleep 5
          done

          if [ "$HEALTH_SUCCESS" != "true" ]; then
            echo "❌ /api/health GAGAL di HyperCloudHost setelah 6 percobaan."
            exit 1
          fi

          # Validasi halaman utama dan katalog penting langsung ke HyperCloudHost
          echo "Memeriksa homepage (/) di HyperCloudHost..."
          curl -k -s -S \
            --resolve "seraphigame.my.id:443:${SSH_HOST}" \
            --resolve "seraphigame.my.id:80:${SSH_HOST}" \
            -f -o /dev/null -w "%{http_code}\n" "$BASE_URL/" | grep -q "^200$" || (echo "❌ Homepage gagal 200 di HyperCloudHost" && exit 1)
          echo "✅ Homepage (/) PASS langsung dari HyperCloudHost"

          echo "Memeriksa /games di HyperCloudHost..."
          curl -k -s -S \
            --resolve "seraphigame.my.id:443:${SSH_HOST}" \
            --resolve "seraphigame.my.id:80:${SSH_HOST}" \
            -f -o /dev/null -w "%{http_code}\n" "$BASE_URL/games" | grep -q "^200$" || (echo "❌ /games gagal 200 di HyperCloudHost" && exit 1)
          echo "✅ /games PASS langsung dari HyperCloudHost"

          echo "Memeriksa /news di HyperCloudHost..."
          curl -k -s -S \
            --resolve "seraphigame.my.id:443:${SSH_HOST}" \
            --resolve "seraphigame.my.id:80:${SSH_HOST}" \
            -f -o /dev/null -w "%{http_code}\n" "$BASE_URL/news" | grep -q "^200$" || (echo "❌ /news gagal 200 di HyperCloudHost" && exit 1)
          echo "✅ /news PASS langsung dari HyperCloudHost"

          echo "Memeriksa /guides di HyperCloudHost..."
          curl -k -s -S \
            --resolve "seraphigame.my.id:443:${SSH_HOST}" \
            --resolve "seraphigame.my.id:80:${SSH_HOST}" \
            -f -o /dev/null -w "%{http_code}\n" "$BASE_URL/guides" | grep -q "^200$" || (echo "❌ /guides gagal 200 di HyperCloudHost" && exit 1)
          echo "✅ /guides PASS langsung dari HyperCloudHost"

          echo "ALL_HEALTH_PASS=true" >> $GITHUB_ENV
          echo "VERIFIED_TARGET_IP=$SSH_HOST" >> $GITHUB_ENV
          echo "✅ SEMUA HEALTH CHECK LANGSUNG KE HYPERCLOUDHOST BERHASIL!"

      - name: 11. Rollback on Failure
        if: failure() && steps.deploy.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.HYPERCLOUD_SSH_HOST }}
          SSH_PORT: ${{ secrets.HYPERCLOUD_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.HYPERCLOUD_SSH_USER }}
          APP_PATH: ${{ secrets.HYPERCLOUD_APP_PATH || '~/seraphigame' }}
        run: |
          echo "=== ⚠️ MEMULAI AUTO-ROLLBACK KE VERSI SEBELUMNYA ==="
          ssh -p $SSH_PORT -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST "
            if [ -d \"$APP_PATH/.backup_next\" ]; then
              echo '[REMOTE] Mengembalikan .backup_next ke .next...'
              rm -rf $APP_PATH/.next
              mv $APP_PATH/.backup_next $APP_PATH/.next
            fi
            if [ -f \"$APP_PATH/.backup_server.js\" ]; then
              echo '[REMOTE] Mengembalikan .backup_server.js ke server.js...'
              mv $APP_PATH/.backup_server.js $APP_PATH/server.js
            fi
            mkdir -p $APP_PATH/tmp
            touch $APP_PATH/tmp/restart.txt
            echo '[REMOTE] Passenger direstart ke versi backup.'
          "
          echo "✅ ROLLBACK COMPLETED ON HYPERCLOUDHOST."
          echo "ROLLBACK_STATUS=SUCCESS" >> $GITHUB_ENV

      - name: 12. Final Deployment Report
        if: always()
        run: |
          echo "=================================================="
          echo "              DEPLOYMENT REPORT                   "
          echo "=================================================="
          echo "SOURCE COMMIT   : ${{ github.sha }}"
          echo "BUILD           : ${{ steps.build.outcome == 'success' && 'PASS' || (steps.check-secrets.outcome == 'failure' && 'BLOCKED' || 'FAIL') }}"
          echo "BUILD LOCATION  : GitHub Actions"
          echo "DEPLOY          : ${{ steps.deploy.outcome == 'success' && 'PASS' || 'FAIL' }}"
          echo "TARGET HOST/IP  : ${{ env.VERIFIED_TARGET_IP || secrets.HYPERCLOUD_SSH_HOST }}"
          echo "DEPLOYED COMMIT : ${{ github.sha }}"
          echo "RESTART         : ${{ steps.restart.outcome == 'success' && 'PASS' || 'FAIL' }}"
          echo "HEALTH CHECK    : ${{ env.ALL_HEALTH_PASS == 'true' && 'PASS' || 'FAIL' }}"
          echo "PRODUCTION URL  : https://seraphigame.my.id (via HyperCloudHost direct)"
          if [ "${{ env.ALL_HEALTH_PASS }}" == "true" ]; then
            echo "ROLLBACK        : NOT NEEDED"
          elif [ "${{ env.ROLLBACK_STATUS }}" == "SUCCESS" ]; then
            echo "ROLLBACK        : SUCCESS"
          else
            echo "ROLLBACK        : NOT APPLICABLE"
          fi
          echo "=================================================="
