<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="360" r="130" fill="#818cf8" opacity="0.05"/>
  <!-- Character silhouette icon -->
  <g transform="translate(300, 350)" stroke="url(#purpleGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-60" r="45" stroke="url(#purpleGrad)" stroke-width="4"/>
    <path d="M-80 70 C-80 0, 80 0, 80 70 Z" stroke="url(#purpleGrad)" stroke-width="4"/>
  </g>
  <text x="300" y="490" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="1">SERAPHI CHARACTER</text>
  <text x="300" y="525" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">No Portrait Available</text>
</svg>
